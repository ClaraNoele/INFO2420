<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Extreme Honeymoons - Graphics</title>

<style type="text/css">


	#thumbs, #image {
		width: 700px;
		border: solid 1px #000;
		text-align: center;
		margin: 0 auto 0 auto;
		color: #000;
		background: #eee;
		padding: 5px;
	}

	#thumbs {
		margin-top: 10px;
	}

			
	#thumbs img {
		border: solid 1px #000;
		margin: 5px;
	}

	#image{
		height:400px;
	}

	.instructions{
		font-style:italic;
	}

</style>

<script language="JavaScript" type="text/javascript">

	PrintButton1 = new Image
	PrintButton2 = new Image
	logo1 = new Image
	logo2 = new Image
if (document.images) {
	PrintButton1.src = "images/print1.jpg"
	PrintButton2.src = "images/print2.jpg"
	logo1.src = "images/logo1.jpg"
	logo2.src = "images/logo2.jpg"
}


		var imgArray = new Array(
			'CoupleBike3Lg.jpg',
			'CoupleCampingLg.jpg',
			'CoupleHikingLg.jpg',
			'ScubaCoupleLg.jpg'
			

		);


		var titleArray = new Array(
			'Biking Couple',
			'Camping Dream',
			'Hiking Couple',
			'Deep Sea Diving'
			
		);
			
		var imgPath = "Images/fullsize/";
		
		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle=titleArray[imgID];

      			textDiv.innerHTML = textTitle;
		}
			
		function preloadImages() {		
			for(var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}
		

</script>


</head>
<body  onload="preloadImages()">

<div align="center">

<div>
	<a href="" onMouseOver="document.getElementById('print').src='Images/Print2.jpg';"
	onmouseout="document.getElementById('print').src='Images/Print1.jpg';">

	<img src="Images/Print1.jpg" alt="Print Page" width="200" height="50"
	id="print">

	</a>
</div>


<div id="logo">
	<a href="" onmouseover="document.getElementById('logo1').src='Images/Logo2.jpg';"
	onmouseout="document.getElementById('logo1').src='Images/Logo1.jpg';">
	
	<img src="Images/Logo1.jpg" alt="Logo" id="logo1">

	</a>
</div>

<br />
<br />
<br />
<br />


<div id="thumbs">
		<img src="Images/thumbnails/CoupleBike3Sm.jpg" alt="Biking Couple" onmouseover="swapImage(0);" />
		<img src="Images/thumbnails/CoupleCampingSm.jpg" alt="Camping Dream" onmouseover="swapImage(1);" />
		<img src="Images/thumbnails/CoupleHikingSm.jpg" alt="Hiking Couple" onmouseover="swapImage(2);" />
		<img src="Images/thumbnails/ScubaSmall.jpg" alt="Deep Sea Diving" onmouseover="swapImage(3);" />
		
</div>

	<div id="image">

		<img id="theImage" src="Images/fullsize/CoupleBike3Lg.jpg" alt="Biking Couple" />
		<h3 id="bottomText">Biking Couple</h3>
	</div>

<img src="images/2colback.jpg" alt="background">

<br />
<br />
<br />
<br />



</div>

<p>
    <a href="http://validator.w3.org/check?uri=referer"><img
      src="http://www.w3.org/Icons/valid-xhtml10" alt="Valid XHTML 1.0 Transitional" height="31" width="88" /></a>
</p>
  

</body>
</html>
